# ==============================================================================
# Food Delivery System — Nginx Production Reverse Proxy Configuration
# Target Location on EC2: /etc/nginx/conf.d/food-del.conf (or /etc/nginx/nginx.conf)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Maximum client payload size (supports Multer 5MB image uploads + multipart metadata)
    client_max_body_size 10M;

    # Gzip compression for static performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy -> Node.js Express server on internal port 4000
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2. Uploaded Food Images -> Persistent Storage with Node.js Fallback
    # --------------------------------------------------------------------------
    location /images/ {
        alias /var/data/food-del/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @images_backend;
    }

    # Fallback to Express static serving if not yet synced to persistent directory
    location @images_backend {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------------------------------
    # 3. Admin Panel -> Single Page Application at /admin/
    # --------------------------------------------------------------------------
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /var/www/food-del/admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # --------------------------------------------------------------------------
    # 4. Customer Frontend -> Single Page Application at /
    # --------------------------------------------------------------------------
    location / {
        root /var/www/food-del/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 5. Friendly Error Handling
    # --------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
