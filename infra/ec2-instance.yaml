AWSTemplateFormatVersion: '2010-09-09'
Description: Ubuntu EC2 host for the Food Delivery application

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    Description: EC2 instance size
  RepositoryUrl:
    Type: String
    Default: https://github.com/namrata-Lamichhane/Food-Delivery.git
    Description: HTTPS clone URL for the application repository
  AllowedSSHCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: IPv4 CIDR range allowed to connect to SSH

Resources:
  FoodDeliveryKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub '${AWS::StackName}-keypair'
      KeyType: rsa
      KeyFormat: pem

  FoodDeliverySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and deployment SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  FoodDeliveryEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref FoodDeliveryKeyPair
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}'
      SecurityGroupIds:
        - !Ref FoodDeliverySecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-app'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          apt-get update
          apt-get install -y ca-certificates curl git nginx
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          npm install --global pm2

          git clone --depth 1 --branch main ${RepositoryUrl} /var/www/food-del
          mkdir -p /var/www/food-del/backend/uploads /var/www/food-del/backend/logs
          chown -R ubuntu:ubuntu /var/www/food-del

          ln -sfn /var/www/food-del/infra/nginx.conf /etc/nginx/sites-available/food-del
          ln -sfn /etc/nginx/sites-available/food-del /etc/nginx/sites-enabled/food-del
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl enable --now nginx

          env PATH=/usr/bin:/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu
Outputs:
  PublicIP:
    Description: Public IPv4 address of the application instance
    Value: !GetAtt FoodDeliveryEC2.PublicIp
  PublicURL:
    Description: HTTP URL of the application
    Value: !Sub 'http://${FoodDeliveryEC2.PublicIp}'
  SSMKeyPath:
    Description: SSM Parameter Store path containing the generated private key
    Value: !Sub '/ec2/keypair/${FoodDeliveryKeyPair.KeyPairId}'
