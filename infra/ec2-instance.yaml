AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Instance for Food Delivery Full-Stack App

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair for SSH access
  InstanceType:
    Type: String
    Default: t2.micro

Resources:
  FoodDeliverySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH, HTTP, and HTTPS
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  FoodDeliveryEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: ami-0c7217cdde317cfec
      SecurityGroupIds:
        - !Ref FoodDeliverySecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update -y
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs nginx git
          npm install -g pm2
          mkdir -p /var/www/food-delivery /var/www/food-uploads
          chown -R ubuntu:ubuntu /var/www/food-delivery /var/www/food-uploads

Outputs:
  PublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt FoodDeliveryEC2.PublicIp
