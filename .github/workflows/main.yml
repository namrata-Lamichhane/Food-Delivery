name: Deploy Food Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -o BatchMode=yes ubuntu@"$EC2_HOST" 'bash -se' <<'EOF'
            set -e

            cd /home/ubuntu/Food-Delivery
            git fetch origin main
            git reset --hard origin/main

            cd backend
            npm ci

            cd ../frontend
            npm ci
            npm run build

            cd ../admin
            npm ci
            npm run build

            pm2 restart food-backend --update-env

            curl -fsS http://localhost/api/food/list > /dev/null

            echo "Food Delivery deployment successful!"
          EOF
