name: Deploy Food Delivery App to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs git
            fi
            sudo apt-get update -y && sudo apt-get install -y nginx
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            if [ ! -d "$HOME/Food-Delivery" ]; then
              git clone https://github.com/namrata-Lamichhane/Food-Delivery.git "$HOME/Food-Delivery"
            fi
            cd "$HOME/Food-Delivery"
            git pull origin main

            cd "$HOME/Food-Delivery/backend"
            cat <<EOF > .env
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            PORT=4000
            EOF
            npm install
            pm2 delete food-backend || true
            pm2 start server.js --name food-backend
            pm2 save

            cd "$HOME/Food-Delivery/frontend"
            echo "VITE_API_URL=http://${{ secrets.EC2_HOST }}" > .env
            npm install
            npm run build

            cd "$HOME/Food-Delivery/admin"
            echo "VITE_API_URL=http://${{ secrets.EC2_HOST }}" > .env
            npm install
            npm run build -- --base=/admin/

            sudo tee /etc/nginx/sites-available/food-delivery > /dev/null <<'EOF'
            server {
                listen 80;
                server_name _;

                location / {
                    root /home/ubuntu/Food-Delivery/frontend/dist;
                    index index.html;
                    try_files $uri $uri/ /index.html;
                }

                location /admin {
                    alias /home/ubuntu/Food-Delivery/admin/dist;
                    index index.html;
                    try_files $uri $uri/ /admin/index.html;
                }

                location /api {
                    proxy_pass http://localhost:4000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                }

                location /images {
                    proxy_pass http://localhost:4000;
                }
            }
            EOF
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sf /etc/nginx/sites-available/food-delivery /etc/nginx/sites-enabled/food-delivery
            sudo chmod o+x /home/ubuntu
            sudo nginx -t && sudo systemctl restart nginx
