
name: Deploy Food Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -o BatchMode=yes ubuntu@"$EC2_HOST" 'bash -se' <<'EOF'
            set -e

            echo "Starting Food Delivery deployment..."

            cd /home/ubuntu/Food-Delivery
            git fetch origin main
            git reset --hard origin/main

            echo "Installing backend dependencies..."
            cd backend
            npm ci

            echo "Building frontend..."
            cd ../frontend
            npm ci
            npm run build

            echo "Building admin panel..."
            cd ../admin
            npm ci
            npm run build

            echo "Restarting backend..."
            pm2 restart food-backend --update-env

            echo "Waiting for backend health check..."

            for i in {1..10}; do
              if curl -fsS http://localhost/api/food/list > /dev/null; then
                echo "API health check passed!"
                break
              fi

              if [ "$i" -eq 10 ]; then
                echo "API health check failed after 10 attempts."
                exit 1
              fi

              sleep 3
            done

            echo "Food Delivery deployment successful!"
          EOF
